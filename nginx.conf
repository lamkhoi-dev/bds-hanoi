events {
    worker_connections 1024;
}
http {
    log_format debug_auth '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_authorization"';
    access_log /var/log/nginx/access.log debug_auth;

    # Rate Limiting Zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # server {
    #     listen 80;
    #     server_name www.nhadatxunghe.vn;
    #     return 301 $scheme://nhadatxunghe.vn$request_uri;
    # }

    server {
        listen 80 default_server;
        server_name _;

        
        client_max_body_size 10m;

        # PLACEHOLDER CHO SSL (Bỏ comment khi đã cài đặt Let's Encrypt / Certbot)
        # listen 443 ssl;
        # ssl_certificate /etc/letsencrypt/live/nhadatxunghe.vn/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/nhadatxunghe.vn/privkey.pem;
        
        # Route API sang Backend NestJS
        location ^~ /api/ {
            limit_req zone=api_limit burst=20 nodelay; # Apply rate limit
            proxy_pass http://backend:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route phục vụ file uploads sang Backend
        location ^~ /uploads/ {
            proxy_pass http://backend:4000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Cache static files từ Frontend NextJS
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            proxy_pass http://frontend:3000;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            proxy_set_header Host $host;
        }

        # Route mặc định sang Frontend NextJS
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
