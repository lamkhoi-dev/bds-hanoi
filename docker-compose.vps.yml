services:
  postgres:
    image: postgres:15-alpine
    container_name: bds-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-bds_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-bds_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # Thiếu restart policy: VPS reboot là DB không lên, cả site chết.
    restart: always
    # Healthcheck này trước đây bị dán nhầm sang service caddy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bds_user} -d ${DB_NAME:-bds_db}"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: bds-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      - backend
      - minio
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bds-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: bds-meilisearch-prod
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILI_ENV: production
    volumes:
      - meilidata_prod:/meili_data
    restart: always

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* được bake vào bundle lúc build, nên phải truyền qua args
      # (truyền qua environment thôi là không đủ).
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${SITE_DOMAIN}/api/v1
        NEXT_PUBLIC_UPLOAD_BASE_URL: https://${SITE_DOMAIN}/bds-uploads
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-Nhà Đất Hà Nội}
        NEXT_PUBLIC_PROVINCE_NAME: ${PROVINCE_NAME:-Hà Nội}
        NEXT_PUBLIC_PROVINCE_SLUG: ${PROVINCE_SLUG:-ha-noi}
        # Tên thương hiệu tách 2 dòng cho logo header — rỗng thì layout.tsx tự lùi về
        # suy luận "tên kết thúc bằng tên tỉnh" (chỉ đúng khi 2 chuỗi này thực sự
        # trùng đuôi, xem site-config.ts).
        NEXT_PUBLIC_BRAND_LINE1: ${NEXT_PUBLIC_BRAND_LINE1:-}
        NEXT_PUBLIC_BRAND_LINE2: ${NEXT_PUBLIC_BRAND_LINE2:-}
        # Tên rút gọn PWA + thông tin liên hệ hiển thị (header/footer/trang hỗ trợ) —
        # trước đây THIẾU ở đây, nên siteConfig.contact.* luôn rỗng mọi bản build.
        NEXT_PUBLIC_SITE_SHORT_NAME: ${NEXT_PUBLIC_SITE_SHORT_NAME:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        # staging => robots.ts chặn index toàn site. Chỉ đổi sang "production"
        # khi đã có dữ liệu Hà Nội và domain chính thức, nếu không site mới sẽ bị
        # Google coi là bản trùng nội dung của nhadatxunghe.vn.
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-staging}
        # Giữ 'report' khi mới deploy: lớp quyết định SEO chỉ ghi log và áp noindex,
        # chưa trả 404/301. Đối chiếu Search Console 1 tuần rồi đổi sang 'enforce'.
        NEXT_PUBLIC_SEO_MODE: ${SEO_MODE:-report}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        INTERNAL_API_URL: http://backend:4000/api/v1
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2}
    container_name: bds-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${SITE_DOMAIN}/api/v1
      INTERNAL_API_URL: http://backend:4000/api/v1
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
    container_name: bds-backend-prod
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://${DB_USER:-bds_user}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-bds_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Không có biến này thì app.module.ts rơi về cache in-memory và BullModule không
      # đăng ký: container Redis vẫn chạy nhưng vô dụng, và refresh token nằm trong RAM
      # nên mỗi lần restart là toàn bộ user bị đăng xuất.
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # Nạp bằng biến môi trường thay vì commit private key vào repo.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      FRONTEND_URL: https://${SITE_DOMAIN}
      PUBLIC_API_URL: https://${SITE_DOMAIN}/api/v1
      SITE_NAME: ${SITE_NAME:-Nhà Đất Hà Nội}
      ACTIVE_PROVINCE_SLUG: ${PROVINCE_SLUG:-ha-noi}
      # Backend dựng URL sitemap phải khớp dạng URL frontend đang phục vụ.
      SEO_MODE: ${SEO_MODE:-report}
      # Mặc định TẮT — xem chú thích trong backend/start.sh. Bật đúng một lần cho
      # lần deploy có migration, rồi trả về false.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      TRUST_PROXY: 'true'
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ENABLE_SCHEDULED_BACKUP: ${ENABLE_SCHEDULED_BACKUP:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-"Support <support@your-domain.com>"}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: bds-uploads
      PUBLIC_UPLOAD_BASE_URL: https://${SITE_DOMAIN}/bds-uploads
    depends_on:
      - postgres
      - redis
      - meilisearch
      - minio
    ports:
      # Chỉ bind loopback. Trước đây publish 0.0.0.0:4000 nên toàn bộ API truy cập được
      # qua HTTP thẳng, bỏ qua Caddy/TLS — JWT và mật khẩu đi cleartext.
      # Muốn debug từ máy khác thì dùng SSH tunnel.
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_prod:/app/uploads
    healthcheck:
      # Route thật là /api/v1/health (global prefix), không phải /health. Và phải dùng
      # 127.0.0.1 vì "localhost" resolve sang ::1 trong khi Node bind 0.0.0.0.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z-cpuv1
    container_name: bds-minio-prod
    ports:
      # Chỉ loopback. Trước đây console 9001 mở ra internet với mật khẩu mặc định
      # admin/admin123 — ai cũng đọc/xoá/thay được toàn bộ ảnh upload.
      # Ảnh công khai vẫn phục vụ qua Caddy tại /bds-uploads/*, không cần publish cổng.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Bắt buộc khai báo, không cho phép rơi về giá trị mặc định.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata_prod:/data
    restart: always

  minio-createbucket:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z-cpuv1
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/bds-uploads || true;
      /usr/bin/mc anonymous set download myminio/bds-uploads;
      exit 0;
      "

volumes:
  pgdata_prod:
  redisdata_prod:
  meilidata_prod:
  uploads_prod:
  miniodata_prod:
  caddy_data_prod:
  caddy_config_prod:
