version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bds-postgres
    environment:
      POSTGRES_USER: bds_user
      POSTGRES_PASSWORD: bds_password
      POSTGRES_DB: bds_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: bds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: bds-meilisearch
    environment:
      - MEILI_MASTER_KEY=bds_master_key_123
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
